<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Reva Photography Studio</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="register-container">

    <div class="register-left">
        <h1>REVA <span>STUDIO</span></h1>
        <p class="tagline">CAPTURE • CREATE • REMEMBER</p>

        <h2>Create Beautiful<br><span>Memories With Us.</span></h2>
        <p>Join Reva Photography Studio and make your special moments unforgettable.</p>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <div class="register-right">
        <div class="register-card">
            <p class="subtitle">JOIN OUR STUDIO</p>
            <h2>Create Account</h2>
            <p class="description">Fill in your details to get started.</p>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number"
                       pattern="[0-9]{10}" maxlength="10" required>

                       <label for="role">Select Role</label>

                <select id="role" name="role" required>
                     <option value="customer">Customer</option>
                     <option value="photographer">Photographer</option>
                     <option value="editor">Editor</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password"
                       minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter your password" minlength="6" required>

                <button type="submit">CREATE ACCOUNT →</button>
            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    try {
        const response = await fetch("http://localhost:5500/api/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                phone: phone,
                password: password,
                role: document.getElementById("role").value
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert("Account created successfully!");
            window.location.href = "login.html";
        } else {
            alert(result.message || "Registration failed!");
        }
    } catch (error) {
        alert("Server connection failed. Please check your backend.");
        console.error(error);
    }
});
</script>

</body>
</html>
